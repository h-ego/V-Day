<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>For Dounia</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1a0a0a 0%, #4a0e0e 100%);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --accent-red: #ff3b3b;
      --text-gold: #f3cf7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      font-family: 'Georgia', serif;
      overflow: hidden;
      color: #fff;
    }

    .glass-card {
      width: min(450px, 90vw);
      padding: 40px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      position: relative;
      z-index: 5;
    }

    /* ANIMATED HEART DESIGN */
    .heart-box {
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      position: relative;
    }

    .heart-svg {
      width: 100%;
      height: 100%;
      fill: var(--accent-red);
      filter: drop-shadow(0 0 15px rgba(255, 59, 59, 0.6));
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 1.8rem;
      color: var(--text-gold);
      margin-bottom: 30px;
      line-height: 1.3;
    }

    .btn-container {
      position: relative;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 12px 35px;
      font-size: 1.1rem;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease-out;
    }

    #yesBtn {
      background: var(--accent-red);
      color: white;
      box-shadow: 0 0 20px rgba(255, 59, 59, 0.4);
      z-index: 2;
    }

    #noBtn {
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
      border: 1px solid rgba(255,255,255,0.2);
      position: absolute;
    }

    .result-view {
      display: none;
      animation: fadeIn 0.8s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .yay-text {
      font-size: 2.2rem;
      color: var(--text-gold);
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="glass-card">
    <div class="heart-box">
      <svg class="heart-svg" viewBox="0 0 32 32">
        <path d="M16 28.5L14.1 26.8C7.33 20.66 2.85 16.59 2.85 11.62C2.85 7.58 6.01 4.42 10.05 4.42C12.33 4.42 14.52 5.48 16 7.14C17.48 5.48 19.67 4.42 21.95 4.42C25.99 4.42 29.15 7.58 29.15 11.62C29.15 16.59 24.67 20.66 17.9 26.81L16 28.5Z"/>
      </svg>
    </div>

    <div id="askView">
      <h1>Dounia, will you be my valentine?</h1>
      <div class="btn-container" id="btnZone">
        <button id="yesBtn">Yes</button>
        <button id="noBtn" style="left: 60%;">No</button>
      </div>
    </div>

  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const askView = document.getElementById('askView');
    const resultView = document.getElementById('resultView');
    const btnZone = document.getElementById('btnZone');
    
    let scale = 1;

    function teleportNo() {
      const zone = btnZone.getBoundingClientRect();
      const maxX = zone.width - noBtn.offsetWidth;
      const maxY = zone.height - noBtn.offsetHeight;
      
      const newX = Math.random() * maxX;
      const newY = Math.random() * maxY;
      
      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
      
      scale += 0.2;
      yesBtn.style.transform = `scale(${scale})`;
    }

    noBtn.addEventListener('mouseover', teleportNo);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      teleportNo();
    });

    yesBtn.addEventListener('click', () => {
    // 1. Trigger celebration confetti
    confetti({ 
        particleCount: 150, 
        spread: 70, 
        origin: { y: 0.6 },
        colors: ['#ff4d4d', '#f3cf7a', '#ffffff'] 
    });

    // 2. Wait 1 second for the confetti to pop, then move to the flowers
    setTimeout(() => {
        const message = "I love you ❤️";
        // This line connects your button directly to flower.html
        window.location.href = "flower.html?msg=" + encodeURIComponent(message);
    }, 1000);
});

  </script>
</body>
</html>
